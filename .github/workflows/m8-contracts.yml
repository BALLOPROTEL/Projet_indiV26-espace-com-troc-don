name: M8 Microservices Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - 'apps/catalog-service/**'
      - 'apps/marketplace-service/**'
      - 'apps/notification-service/**'
      - 'infra/k8s/minikube/platform-ingress.yaml'
      - 'tests/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/m8-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract compatibility M8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate API, authorization, asynchronous event and Ingress contracts
        run: pnpm m8:contracts:validate
      - name: Verify Marketplace to Catalog HTTP failure contracts
        run: pnpm m8:integration:unit
      - name: Validate durable Notification Prisma client, tests and compilation
        env:
          NOTIFICATION_DATABASE_URL: postgresql://app:example@localhost:5432/projet_indiv26?schema=notification
        run: pnpm notification:quality
