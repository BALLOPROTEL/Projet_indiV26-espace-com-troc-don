name: Generate Next.js lockfile #115

on:
  push:
    branches:
      - security/115-nextjs-16-4-6
    paths:
      - apps/web/package.json

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate pnpm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify requested versions
        run: |
          grep -q "specifier: 16.4.6" pnpm-lock.yaml
          grep -q "next@16.4.6" pnpm-lock.yaml
          grep -q "eslint-config-next@16.4.6" pnpm-lock.yaml

      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextjs-16-4-6-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
