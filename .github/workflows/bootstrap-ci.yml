name: Bootstrap CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  repository-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projet_indiv26
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d projet_indiv26"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app_ci_password@localhost:5432/projet_indiv26?schema=public
      CATALOG_DATABASE_URL: postgresql://app:app_ci_password@localhost:5432/projet_indiv26?schema=catalog
      MARKETPLACE_DATABASE_URL: postgresql://app:app_ci_password@localhost:5432/projet_indiv26?schema=marketplace
      CATALOG_INTERNAL_URL: http://127.0.0.1:3101
      INTERNAL_SERVICE_TOKEN: ci_internal_service_token_2026_long_value
      KEYCLOAK_ISSUER: http://localhost:8081/realms/projet-indiv26
      KEYCLOAK_AUDIENCE: api
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: listing-images
      S3_ACCESS_KEY: marketplace-api
      S3_SECRET_KEY: marketplace_storage_local_change_me_2026
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/00-cadrage-technique.md
          test -f docs/01-architecture.md
          test -f docs/02-quality-gates.md
          test -f docs/05-lot1-base-technique.md
          test -f docs/06-lot2-keycloak-rbac.md
          test -f docs/07-lot3-listings-moderation.md
          test -f docs/08-lot4-quality-gates.md
          test -f docs/09-lot5-supply-chain.md
          test -f docs/10-lot6-kubernetes.md
          test -f docs/11-lot6b-frontend.md
          test -f docs/12-lot7-observability.md
          test -f docs/13-lot8-performance.md
          test -f docs/14-lot9-security-audit.md
          test -f docs/15-lot9b-a-marketplace-domain.md
          test -f docs/16-lot9b-b-object-storage.md
          test -f docs/17-lot9b-c-enriched-publishing.md
          test -f docs/18-microservices-migration.md
          test -f apps/catalog-service/package.json
          test -f apps/catalog-service/prisma/schema.prisma
          test -f apps/catalog-service/prisma/migrations/20261006_173500_init_catalog/migration.sql
          test -f apps/marketplace-service/package.json
          test -f apps/marketplace-service/prisma/schema.prisma
          test -d apps/marketplace-service/prisma/migrations
          test -f apps/marketplace-service/src/proposals/proposals.service.ts
          test -f apps/marketplace-service/src/transactions/transactions.service.ts
          test -f apps/marketplace-service/src/transactions/transactions.service.spec.ts
          test -f apps/gateway/src/proxy.ts
          test -f apps/gateway/src/observability.ts
          test -f apps/gateway/src/security.ts
          test -f apps/gateway/src/metrics.controller.ts
          test -f apps/gateway/src/routes.ts
          test -f apps/gateway/test/routes.test.mjs
          test -f apps/gateway/test/proxy.test.mjs
          test -f apps/gateway/test/observability.test.mjs
          test -f scripts/services-dev.sh
          test -f scripts/m4-gateway-smoke.sh
          test -f apps/api/prisma/migrations/20260928_093000_requeue_invalid_enriched_approvals/migration.sql
          test -f apps/api/prisma/migrations/20260928_104500_reconcile_legacy_enriched_approvals/migration.sql
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f pnpm-lock.yaml
          test -f compose.yaml
          test -f .dockerignore
          test -f apps/api/Dockerfile
          test -f apps/api/package.json
          test -f apps/api/prisma/schema.prisma
          test -f apps/api/prisma/migrations/20260926_210000_add_marketplace_workflow/migration.sql
          test -f apps/api/src/marketplace/marketplace.module.ts
          test -f apps/api/src/marketplace/marketplace-rules.service.ts
          test -f apps/api/src/marketplace/marketplace-rules.service.spec.ts
          test -f apps/api/src/storage/object-storage.service.ts
          test -f apps/api/src/storage/storage.module.ts
          test -f apps/api/src/listings/image-file.validator.ts
          test -f apps/api/src/listings/listing-images.service.ts
          test -f apps/api/src/listings/listing-images.controller.ts
          test -f apps/api/test/object-storage.integration-spec.ts
          test -f apps/api/eslint.config.mjs
          test -f apps/api/jest.config.cjs
          test -f apps/api/jest.integration.config.cjs
          test -f apps/api/jest.e2e.config.cjs
          test -f apps/web/package.json
          test -f apps/web/next.config.ts
          test -f apps/web/tsconfig.json
          test -f apps/web/eslint.config.mjs
          test -f apps/web/app/page.tsx
          test -f apps/web/app/globals.css
          test -f apps/web/lib/publication.ts
          test -f apps/web/lib/publication.test.ts
          test -f infra/keycloak/projet-indiv26-realm.json
          test -f scripts/keycloak-smoke.sh
          test -f scripts/lot3-smoke.sh
          test -f scripts/lot5-image-smoke.sh
          test -f scripts/lot6-minikube-up.sh
          test -f scripts/lot6-k8s-validate.sh
          test -f scripts/lot7-observability-validate.sh
          test -f scripts/lot7-minikube-up.sh
          test -f scripts/lot8-load-run.sh
          test -f scripts/lot8-load-validate.sh
          test -f scripts/lot9-security-audit.sh
          test -f scripts/lot9-security-live.sh
          test -f scripts/lot9b-storage-validate.sh
          test -f infra/minio/listing-images-policy.json
          test -f infra/k8s/minikube/minio-deployment.yaml
          test -f infra/k8s/minikube/minio-service.yaml
          test -f infra/k8s/minikube/minio-bootstrap-job.yaml
          test -f tests/load/lot8-api-hpa.jmx
          test -f tests/load/Dockerfile.jmeter
          test -f tests/load/summarize_jtl.py
          test -f tests/load/build_report.py
          test -f tests/load/keycloak-experimentation.md
          test -f infra/k8s/minikube/kustomization.yaml
          test -d apps/web
          test -d infra/k8s
          test -d tests/load
          echo "Repository baseline: OK"

      - name: Ensure no tracked dotenv secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Tracked dotenv file detected."
            exit 1
          fi
          echo "No tracked dotenv secret files detected."

      - name: Validate Kubernetes manifests
        shell: bash
        run: bash scripts/lot6-k8s-validate.sh --manifest-only

      - name: Validate Observability manifests
        shell: bash
        run: bash scripts/lot7-observability-validate.sh --manifest-only

      - name: Validate LOT 8 load-test artifacts
        shell: bash
        run: bash scripts/lot8-load-validate.sh

      - name: Validate LOT 9 security controls
        shell: bash
        run: bash scripts/lot9-security-audit.sh --static

      - name: Validate LOT 9B-B storage manifests
        shell: bash
        run: bash scripts/lot9b-storage-validate.sh --static

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate LOT 9B-A marketplace domain
        run: pnpm marketplace:validate

      - name: Validate LOT 9B-C enriched publication
        run: pnpm publication:validate

      - name: Apply Prisma migrations
        run: pnpm db:deploy

      - name: Validate Catalog Prisma schema
        run: pnpm catalog:prisma:validate

      - name: Apply Catalog Prisma migrations
        run: pnpm catalog:migrate:deploy

      - name: Validate Marketplace Prisma schema
        run: pnpm marketplace-service:prisma:validate

      - name: Apply Marketplace Prisma migrations
        run: pnpm marketplace-service:migrate:deploy

      - name: Validate LOT 9B-B object storage
        run: pnpm storage:validate

      - name: Lint API
        run: pnpm api:lint

      - name: Typecheck API
        run: pnpm api:typecheck

      - name: Unit tests
        run: pnpm api:test

      - name: PostgreSQL integration tests
        run: pnpm api:test:integration

      - name: HTTP acceptance E2E tests
        run: pnpm api:test:e2e

      - name: Coverage gate
        run: pnpm api:test:coverage

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage-${{ github.sha }}
          path: coverage/api
          if-no-files-found: warn
          retention-days: 30

      - name: Build API
        run: pnpm api:build

      - name: Typecheck microservices
        run: pnpm services:typecheck

      - name: Build microservices
        run: pnpm services:build

      - name: Test API Gateway
        run: pnpm gateway:quality

      - name: Test Catalog Service
        run: pnpm catalog:test

      - name: Test Marketplace Service
        run: pnpm marketplace-service:test

      - name: Smoke test M4 API Gateway routing
        run: pnpm gateway:smoke

      - name: Smoke test Catalog Service HTTP
        shell: bash
        run: |
          set -euo pipefail

          pnpm catalog:dev > /tmp/catalog-service.log 2>&1 &
          catalog_pid=$!

          cleanup() {
            kill "${catalog_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health/live > /tmp/catalog-live.json; then
              break
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              cat /tmp/catalog-service.log
              exit 1
            fi

            sleep 1
          done

          grep -q '"service":"catalog-service"' /tmp/catalog-live.json
          curl -fsS http://127.0.0.1:3101/listings > /tmp/catalog-listings.json

          node -e "
            const fs = require('fs');
            const value = JSON.parse(
              fs.readFileSync('/tmp/catalog-listings.json', 'utf8')
            );
            if (!Array.isArray(value)) process.exit(1);
          "

          echo "Catalog Service HTTP smoke: PASS"

      - name: Smoke test Marketplace transaction lifecycle
        shell: bash
        run: |
          set -euo pipefail

          pnpm catalog:dev > /tmp/catalog-m3-ci.log 2>&1 &
          catalog_pid=$!

          pnpm marketplace-service:dev > /tmp/marketplace-m3-ci.log 2>&1 &
          marketplace_pid=$!

          cleanup() {
            kill "${catalog_pid}" "${marketplace_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            catalog_ok=0
            marketplace_ok=0

            curl -fsS http://127.0.0.1:3101/health/live >/dev/null               && catalog_ok=1 || true
            curl -fsS http://127.0.0.1:3102/health/live >/dev/null               && marketplace_ok=1 || true

            if [[ "${catalog_ok}" -eq 1 && "${marketplace_ok}" -eq 1 ]]; then
              break
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "=== Catalog log ==="
              cat /tmp/catalog-m3-ci.log
              echo "=== Marketplace log ==="
              cat /tmp/marketplace-m3-ci.log
              exit 1
            fi

            sleep 1
          done

          wrong_status="$(
            curl -sS               -o /tmp/catalog-internal-denied.json               -w '%{http_code}'               -H 'x-internal-service-token: wrong-token'               http://127.0.0.1:3101/internal/listings/m3-ci-listing
          )"

          test "${wrong_status}" = "401"

          pnpm --filter catalog-service exec node - <<'NODE'
          const { PrismaClient } = require('./generated/prisma');

          (async () => {
            const prisma = new PrismaClient({
              datasources: {
                db: { url: process.env.CATALOG_DATABASE_URL },
              },
            });

            try {
              await prisma.listing.deleteMany({
                where: { id: 'm3-ci-listing' },
              });

              await prisma.listing.create({
                data: {
                  id: 'm3-ci-listing',
                  ownerId: 'm3-ci-owner',
                  title: 'M3 CI smoke',
                  description: 'Temporary CI listing for microservice transaction lifecycle.',
                  operationType: 'DONATION',
                  status: 'APPROVED',
                  availabilityStatus: 'AVAILABLE',
                },
              });
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          pnpm --filter marketplace-service exec node - <<'NODE'
          const { ConfigService } = require('@nestjs/config');
          const { PrismaService } =
            require('./dist/prisma/prisma.service.js');
          const { CatalogClientService } =
            require('./dist/catalog/catalog-client.service.js');
          const { MarketplaceRulesService } =
            require('./dist/marketplace/marketplace-rules.service.js');
          const { ProposalsService } =
            require('./dist/proposals/proposals.service.js');
          const { TransactionsService } =
            require('./dist/transactions/transactions.service.js');

          (async () => {
            const prisma = new PrismaService();

            try {
              const catalog = new CatalogClientService(
                new ConfigService(process.env),
              );
              const rules = new MarketplaceRulesService();
              const proposals = new ProposalsService(prisma, catalog, rules);
              const transactions =
                new TransactionsService(prisma, catalog, rules);

              await prisma.marketplaceTransaction.deleteMany({
                where: { proposalId: 'm3-ci-proposal' },
              });
              await prisma.proposal.deleteMany({
                where: { id: 'm3-ci-proposal' },
              });

              await prisma.proposal.create({
                data: {
                  id: 'm3-ci-proposal',
                  targetListingId: 'm3-ci-listing',
                  requesterId: 'm3-ci-requester',
                  type: 'DONATION_REQUEST',
                  status: 'PENDING',
                },
              });

              const transaction = await proposals.accept(
                'm3-ci-proposal',
                'm3-ci-owner',
              );

              if (transaction.status !== 'IN_PROGRESS') {
                throw new Error('Expected transaction IN_PROGRESS');
              }

              const reserved = await catalog.getListing('m3-ci-listing');
              if (reserved.availabilityStatus !== 'RESERVED') {
                throw new Error('Expected listing RESERVED');
              }

              const first = await transactions.confirm(
                transaction.id,
                'm3-ci-owner',
              );
              if (first.status !== 'IN_PROGRESS') {
                throw new Error('Expected first confirmation IN_PROGRESS');
              }

              const second = await transactions.confirm(
                transaction.id,
                'm3-ci-requester',
              );
              if (second.status !== 'COMPLETED') {
                throw new Error('Expected transaction COMPLETED');
              }

              const completed = await catalog.getListing('m3-ci-listing');
              if (completed.availabilityStatus !== 'COMPLETED') {
                throw new Error('Expected listing COMPLETED');
              }

              console.log('Marketplace transaction lifecycle smoke: PASS');
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          pnpm --filter marketplace-service exec node - <<'NODE'
          const { PrismaClient } = require('./generated/prisma');

          (async () => {
            const prisma = new PrismaClient({
              datasources: {
                db: { url: process.env.MARKETPLACE_DATABASE_URL },
              },
            });

            try {
              await prisma.marketplaceTransaction.deleteMany({
                where: { proposalId: 'm3-ci-proposal' },
              });
              await prisma.proposal.deleteMany({
                where: { id: 'm3-ci-proposal' },
              });
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          pnpm --filter catalog-service exec node - <<'NODE'
          const { PrismaClient } = require('./generated/prisma');

          (async () => {
            const prisma = new PrismaClient({
              datasources: {
                db: { url: process.env.CATALOG_DATABASE_URL },
              },
            });

            try {
              await prisma.listing.deleteMany({
                where: { id: 'm3-ci-listing' },
              });
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Lint Web
        run: pnpm web:lint

      - name: Typecheck Web
        run: pnpm web:typecheck

      - name: Unit tests Web
        run: pnpm web:test

      - name: Build Web
        run: pnpm web:build

      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security

          # pnpm may return a non-zero status when lower-severity advisories are
          # present even though this project's gate is HIGH/CRITICAL only.
          pnpm audit --prod --json > reports/security/pnpm-audit.json || true

          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync('reports/security/pnpm-audit.json', 'utf8'),
          );
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          const high = Number(vulnerabilities.high ?? 0);
          const critical = Number(vulnerabilities.critical ?? 0);

          console.log(
            `Production audit summary: moderate=${vulnerabilities.moderate ?? 0}, high=${high}, critical=${critical}`,
          );

          if (high > 0 || critical > 0) {
            console.error('Production dependency audit: FAIL (HIGH/CRITICAL found)');
            process.exit(1);
          }

          console.log('Production dependency audit: PASS');
          NODE

      - name: Prepare image metadata
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          image_name="ghcr.io/${owner_lower}/projet-indiv26-api"
          image_ref="${image_name}:sha-${short_sha}"
          echo "IMAGE_NAME=${image_name}" >> "${GITHUB_ENV}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${short_sha}" >> "${GITHUB_ENV}"

      - name: Build API container image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --file apps/api/Dockerfile \
            --tag "${IMAGE_REF}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=sha-${SHORT_SHA}" \
            .

      - name: Smoke test API container image
        shell: bash
        run: bash scripts/lot5-image-smoke.sh "${IMAGE_REF}"

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: reports/security/trivy-image.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '0'

      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.sha }}
          path: reports/security
          if-no-files-found: warn
          retention-days: 30

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "Published ${IMAGE_REF}"
          echo "Published ${IMAGE_NAME}:latest"
