name: Bootstrap CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate LOT 0 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/00-cadrage-technique.md
          test -f docs/01-architecture.md
          test -f docs/02-quality-gates.md
          test -d apps/api
          test -d apps/web
          test -d infra/k8s
          test -d tests/load
          echo "LOT 0 repository baseline: OK"

      - name: Ensure no tracked dotenv secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Tracked dotenv file detected."
            exit 1
          fi
          echo "No tracked dotenv secret files detected."
