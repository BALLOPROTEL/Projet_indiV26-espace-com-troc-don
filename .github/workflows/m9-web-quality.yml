name: M9 Web Donation Trade Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/m9-web-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: M9 Web lint typecheck unit build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm web:lint
      - name: Typecheck
        run: pnpm web:typecheck
      - name: Unit tests
        run: pnpm web:test
      - name: Production build
        run: pnpm web:build
