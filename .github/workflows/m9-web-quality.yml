name: M9 Web Donation Trade Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/m9-web-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: M9 Web lint typecheck unit build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm web:lint
      - name: Typecheck
        run: pnpm web:typecheck
      - name: Unit tests
        run: pnpm web:test
      - name: Production build
        run: pnpm web:build
