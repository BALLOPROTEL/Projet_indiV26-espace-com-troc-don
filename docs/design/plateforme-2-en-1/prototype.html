function sectionHeading(h,sub,go,label='Tout voir →'){return `<div class="section-heading"><div><h2 class="section-title">${h}</h2>${sub?`<div class="section-sub">${sub}</div>`:''}</div>${go?`<button class="text-link" data-go="${go}">${label}</button>`:''}</div>`}
function crumb(...a){return `<div class="breadcrumb">${['Accueil',...a].map((x,i)=>i===0?`<button class="text-link" data-go="home" style="font-size:12px;color:#8d9aab">Accueil</button>`:`<span>›</span><span>${esc(x)}</span>`).join('')}</div>`}
function home(){return `<div class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">✦ Boutique & univers communautaire</div><h1>Des frissons à acheter.<br><em>Des passions à partager.</em></h1><p>Découvrez les objets cultes de l’horreur et du fantastique. Achetez vos coups de cœur, échangez vos trésors ou offrez-leur une seconde vie.</p><div class="hero-actions"><button class="btn primary" data-go="shop">Explorer la boutique →</button><button class="btn" style="background:#fff;color:var(--navy)" data-go="swap">Découvrir les échanges ↔</button></div></div><div class="hero-graphic"><div class="moon"></div><div class="bat">🦇</div><div class="house"><div class="house-roof"></div><div class="house-main"></div><div class="house-win one"></div><div class="house-win two"></div><div class="house-door"></div></div><div class="hero-float a"><span class="symbol">🛍️</span> Boutique & collections</div><div class="hero-float b"><span class="symbol">🔄</span> Échanges entre passionnés</div></div></section><div class="promise">${[['🚚','Livraison suivie','Sur toutes les commandes'],['🔒','Paiement sécurisé','Parcours d’achat protégé'],['♻️','Seconde vie','Dons et trocs entre membres'],['💬','Une vraie communauté','Échangez avec les passionnés']].map(([i,h,t])=>`<div class="promise-item"><span class="promise-icon">${i}</span><div><strong>${h}</strong>${t}</div></div>`).join('')}</div><section class="section">${sectionHeading('Explorez nos univers','Une sélection inspirée du cinéma, du fantastique et des jeux.') }<div class="cats">${cats.map(([i,c])=>`<button class="cat" data-cat="${esc(c)}"><span class="cat-icon">${i}</span><span>${esc(c)}</span></button>`).join('')}</div></section><section class="section">${sectionHeading('Les coups de cœur du moment','Des pièces étonnantes choisies pour les passionnés.','shop')}<div class="grid4">${products.slice(0,4).map(productCard).join('')}</div></section><section class="section"><div class="split-feature"><div><div class="product-category">LE COIN DES PASSIONNÉS</div><h2>Un objet chez vous.<br>Une belle histoire ailleurs.</h2><p>Proposez un livre, un jeu ou une figurine en don ou en échange. Rencontrez d’autres collectionneurs autour des mêmes passions.</p><div class="hero-actions"><button class="btn secondary" data-go="swap">Voir les annonces ↔</button><button class="btn outline" data-go="publish">Déposer une annonce</button></div></div><div class="swap-illustration"><span>📚</span><strong class="swap-arrow">⇄</strong><span>🎲</span></div></div></section><section class="section">${sectionHeading('Tout juste dans la communauté','Échange, donne, découvre.','swap')}<div class="grid3">${listings.slice(0,3).map(listingCard).join('')}</div></section><section class="section">${sectionHeading('L’univers se raconte aussi','Le fanzine et le festival de la Petite Maison.')}<div class="grid2"><div class="panel" style="display:flex;gap:20px;align-items:center;padding:20px"><div class="fanzine-cover" style="min-width:40%;height:170px"><strong>ÉPOUVANTE<br>#18</strong></div><div><div class="product-category">LE FANZINE</div><h3 style="color:var(--navy)">Des histoires à dévorer</h3><p class="page-desc">Numéros numériques, papier et abonnements.</p><button class="btn ghost small" data-go="fanzine">Découvrir →</button></div></div><div class="panel" style="display:flex;gap:20px;align-items:center;padding:20px"><div class="fanzine-cover" style="background:linear-gradient(130deg,#392b53,#9e5479);min-width:40%;height:170px"><strong>FESTIVAL<br>🎬</strong></div><div><div class="product-category">ÉVÉNEMENTS</div><h3 style="color:var(--navy)">Le Petit Festival</h3><p class="page-desc">Projections, masterclasses et expériences.</p><button class="btn ghost small" data-go="news">Voir l’actualité →</button></div></div></div></section></div>`}
function shop(){let f=products.filter(p=>(S.shopCat==='Tout'||p.cat===S.shopCat)&&(!S.shopSearch||p.name.toLowerCase().includes(S.shopSearch.toLowerCase())));if(S.shopSort==='low')f.sort((a,b)=>a.price-b.price);else if(S.shopSort==='high')f.sort((a,b)=>b.price-a.price);return `<div class="wrap">${crumb('Boutique')}<div class="page-top"><h1 class="page-title">Notre boutique fantastique</h1><div class="page-desc">Figurines, films, bandes dessinées, jeux et objets de collection.</div></div><div class="shop-layout"><aside class="filter-panel panel"><div class="filter-heading">Filtres <button class="text-link" data-clearshop>Effacer</button></div><div class="filter-block"><h4>Catégories</h4>${['Tout',...new Set(products.map(p=>p.cat))].map(c=>`<label class="check-row"><input type="radio" name="cat" value="${esc(c)}" ${S.shopCat===c?'checked':''} data-shopcat="${esc(c)}"/> ${esc(c)}</label>`).join('')}</div><div class="filter-block"><h4>Disponibilité</h4><label class="check-row"><input type="checkbox" checked disabled/> En stock</label><label class="check-row"><input type="checkbox" disabled/> En promotion</label></div><div class="filter-block"><div class="notice">✦ Chaque univers possède ses propres pépites. Filtrez pour découvrir votre prochain coup de cœur.</div></div></aside><div><div class="result-bar"><span><strong>${f.length}</strong> articles trouvés</span><div style="display:flex;gap:10px;flex-wrap:wrap"><input class="field" id="shopsearch" placeholder="Rechercher un article…" value="${esc(S.shopSearch)}" style="max-width:215px;padding:10px"/><select id="sort" class="select"><option value="pop" ${S.shopSort==='pop'?'selected':''}>Pertinence</option><option value="low" ${S.shopSort==='low'?'selected':''}>Prix croissant</option><option value="high" ${S.shopSort==='high'?'selected':''}>Prix décroissant</option></select></div></div>${f.length?`<div class="grid3">${f.map(productCard).join('')}</div>`:`<div class="empty"><span>🔎</span>Aucun article ne correspond à cette recherche.</div>`}</div></div></div>`}
function product(){let p=products.find(x=>x.id===S.prod)||products[0];return `<div class="wrap">${crumb('Boutique',p.name)}<div class="product-detail">${art(p,true)}<div class="detail-info"><div class="product-category">${esc(p.cat)} · ${p.badge||'Collection'}</div><h1>${esc(p.name)}</h1><div class="stars">★★★★★ <span class="muted">4,9 / 5 · 24 avis</span></div><div class="detailprice">${euro(p.price)} ${p.old?`<span class="smallprice">${euro(p.old)}</span>`:''}</div><span class="pill">✓ Disponible — ${p.stock} en stock</span><p>${esc(p.desc)}<br>Un article sélectionné pour les passionnés de La Petite Maison de l’Épouvante.</p><div class="detail-actions"><div class="qty"><button data-qty="-1">−</button><strong>${S.quantity}</strong><button data-qty="1">+</button></div><button class="btn primary" data-add-qty="${p.id}">🛒 Ajouter au panier</button><button class="btn outline" data-fav="${p.id}">${S.fav.has(p.id)?'♥ Favori':'♡ Favoris'}</button></div><ul class="spec-list"><li>✓ <strong>Livraison :</strong> France et Europe (concept)</li><li>✓ <strong>Retours :</strong> politique à définir</li><li>✓ <strong>Paiement :</strong> parcours sécurisé à prévoir</li></ul><div class="notice">ℹ️ Ces fiches et tarifs sont des données fictives pour visualiser le prototype avant développement.</div></div></div><section class="section">${sectionHeading('Vous aimerez aussi','Dans le même univers…','shop')}<div class="grid4">${products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></section></div>`}
function swap(){let f=listings.filter(l=>S.swapFilter==='Tous'||l.type===S.swapFilter);return `<div class="wrap">${crumb('Échanges & dons')}<div class="hero" style="min-height:235px;grid-template-columns:1fr 190px;margin-top:15px;background:linear-gradient(110deg,#0e585e,#20afa3)"><div class="hero-copy" style="padding:33px"><div class="eyebrow">♻️ L'espace communautaire</div><h1 style="font-size:34px;margin:12px 0">Partagez plus que des objets.</h1><p style="margin:0">Donnez une seconde vie à vos collections ou trouvez la pièce qui vous manque.</p><button class="btn primary" data-go="publish" style="margin-top:18px">+ Publier une annonce</button></div><div style="display:grid;place-items:center;font-size:94px;opacity:.8">⇄</div></div><div class="section-heading" style="margin-top:29px"><div><h2 class="section-title">Annonces de la communauté</h2><p class="section-sub">Trouvez des échanges et des dons près de vous.</p></div><button class="btn secondary small" data-go="publish">+ Déposer une annonce</button></div><div class="chips">${['Tous','Échange','Don'].map(c=>`<button class="chip ${S.swapFilter===c?'active':''}" data-swapfilter="${c}">${c==='Tous'?'Toutes les annonces':c==='Don'?'🎁 Dons':'🔄 Échanges'}</button>`).join('')}</div><div class="grid3">${f.map(listingCard).join('')}</div><div class="notice" style="margin-top:24px">✓ Les annonces sont modérées avant publication. Aucun paiement n'est intégré à l’espace de don/troc dans cette maquette.</div></div>`}
function listing(){let l=listings.find(x=>x.id===S.listing)||listings[0];return `<div class="wrap">${crumb('Échanges & dons',l.name)}<div class="product-detail">${art(l,true)}<div class="detail-info"><div class="product-category">${l.type==='Don'?'DON GRATUIT':'TROC & ÉCHANGE'}</div><h1>${esc(l.name)}</h1><span class="pill">${esc(l.type)} · Annonce active</span><p>${esc(l.desc)}</p><ul class="spec-list"><li>⌖ <strong>Localisation :</strong> ${esc(l.city)}</li><li>♻ <strong>État :</strong> ${esc(l.condition)}</li><li>↔ <strong>Souhait :</strong> ${esc(l.want)}</li><li>✉ <strong>Annonce déposée :</strong> ${l.date||'À l’instant'}</li></ul><div class="prose-card" style="display:flex;align-items:center;gap:14px"><span class="avatar" style="width:46px;height:46px">${esc(l.initials||'MO')}</span><div><strong style="color:var(--navy)">${esc(l.by)}</strong><div class="muted mini">Membre de la communauté</div></div><span style="margin-left:auto;color:var(--teal-d);font-size:12px;font-weight:800">✓ Profil vérifié*</span></div><div class="detail-actions"><button class="btn secondary" data-go="chat">💬 Contacter le membre</button><button class="btn outline" data-go="swap">← Toutes les annonces</button></div><p class="muted" style="font-size:11px">*État illustratif uniquement dans cette maquette.</p></div></div><section class="section">${sectionHeading('Autres annonces à découvrir','Encore des trouvailles de la communauté.')}<div class="grid3">${listings.filter(x=>x.id!==l.id).slice(0,3).map(listingCard).join('')}</div></section></div>`}
function publish(){return `<div class="wrap">${crumb('Échanges & dons','Nouvelle annonce')}<div class="page-top"><h1 class="page-title">Publier une annonce</h1><p class="page-desc">Offrez une seconde vie à vos objets. La modération vérifie votre annonce avant diffusion.</p></div><div class="checkout-grid"><form class="prose-card" id="publishForm"><h3 style="margin:0;color:var(--navy)">Description de l'objet</h3><label class="form-label">Type d'annonce *</label><select class="field" name="type"><option>Échange</option><option>Don</option></select><label class="form-label">Titre de l'annonce *</label><input class="field" name="title" required placeholder="Ex. : Collection de BD fantastiques"/><div class="form-grid"><div><label class="form-label">Catégorie</label><select class="field" name="category">${cats.map(x=>`<option>${x[1]}</option>`).join('')}</select></div><div><label class="form-label">État</label><select class="field" name="condition"><option>Très bon état</option><option>Comme neuf</option><option>Bon état</option><option>État correct</option></select></div></div><label class="form-label">Description *</label><textarea class="field" rows="4" name="description" required placeholder="Décrivez votre objet, son état, ce qui le rend unique…"></textarea><div class="form-grid"><div><label class="form-label">Ville *</label><input class="field" name="city" required placeholder="Ex. : Paris"/></div><div><label class="form-label">Vous recherchez en retour</label><input class="field" name="want" placeholder="Ex. : Un jeu de société"/></div></div><div class="form-actions"><button type="button" class="btn outline" data-go="swap">Annuler</button><button type="submit" class="btn secondary">Soumettre à modération →</button></div></form><div class="summary"><h3 style="color:var(--navy);margin-top:0">✓ Comment ça fonctionne ?</h3><p class="page-desc">1. Décrivez votre objet et choisissez Don ou Échange.</p><p class="page-desc">2. Votre annonce est vérifiée par la modération.</p><p class="page-desc">3. Les membres intéressés vous contactent par messagerie.</p><div class="divider"></div><div class="notice">🔒 Ne partagez pas vos informations personnelles dans les annonces publiques.</div><div style="margin-top:22px;height:170px;border-radius:14px;border:2px dashed #d0e2df;display:grid;place-items:center;color:#6f9993;font-size:13px">📷 &nbsp; Zone de photos — maquette</div></div></div></div>`}
function cart(){let rows=Object.entries(S.cart).filter(([k,v])=>v>0).map(([k,v])=>({p:products.find(p=>p.id==k),v})).filter(x=>x.p);return `<div class="wrap">${crumb('Mon panier')}<div class="page-top"><h1 class="page-title">Mon panier <span style="color:var(--teal)">(${count()})</span></h1><p class="page-desc">Retrouvez les articles sélectionnés avant de passer votre commande.</p></div>${rows.length?`<div class="checkout-grid"><div class="prose-card" style="padding:12px 24px">${rows.map(({p,v})=>`<div class="cart-line">${art(p)}<div><h3>${esc(p.name)}</h3><p>${esc(p.cat)}</p><button class="text-link" data-remove="${p.id}" style="font-size:11px">Supprimer</button></div><div><strong class="price">${euro(p.price*v)}</strong><div class="qty" style="margin-top:9px;gap:10px;padding:8px"><button data-cartqty="${p.id}:-1">−</button><strong>${v}</strong><button data-cartqty="${p.id}:1">+</button></div></div></div>`).join('')}</div><div class="summary"><h3 style="color:var(--navy);margin-top:0">Récapitulatif</h3><div class="summary-line"><span>Sous-total (${count()} articles)</span><strong>${euro(total())}</strong></div><div class="summary-line"><span>Livraison</span><span>Calculée ensuite</span></div><div class="summary-line total"><span>Total provisoire</span><strong>${euro(total())}</strong></div><button class="btn primary wide" data-go="checkout">Passer commande →</button><button class="btn outline wide" data-go="shop" style="margin-top:9px">Continuer mes achats</button><p style="font-size:11px;color:var(--muted);text-align:center">🔒 Paiement fictif dans la maquette.</p></div></div>`:`<div class="empty" style="margin:20px auto;max-width:630px"><span>🛒</span><h3 style="color:var(--navy)">Votre panier est vide</h3><p>Un monde de belles trouvailles vous attend.</p><button class="btn primary" data-go="shop">Découvrir la boutique</button></div>`}</div>`}
function checkout(){return `<div class="wrap">${crumb('Panier','Commande')}<div class="page-top"><h1 class="page-title">Finaliser ma commande</h1><div class="progress-steps"><span class="step active">1. Panier</span><span class="step-arrow">›</span><span class="step active">2. Livraison et paiement</span><span class="step-arrow">›</span><span class="step">3. Confirmation</span></div></div><div class="checkout-grid"><form id="checkoutForm" class="prose-card"><h3 style="color:var(--navy);margin-top:0">📦 Vos coordonnées</h3><div class="form-grid"><div><label class="form-label">Prénom *</label><input class="field" required placeholder="Prénom"/></div><div><label class="form-label">Nom *</label><input class="field" required placeholder="Nom"/></div></div><label class="form-label">Adresse e-mail *</label><input class="field" type="email" required placeholder="vous@exemple.fr"/><label class="form-label">Adresse *</label><input class="field" required placeholder="Numéro et rue"/><div class="form-grid"><div><label class="form-label">Code postal *</label><input class="field" required placeholder="75000"/></div><div><label class="form-label">Ville *</label><input class="field" required placeholder="Paris"/></div></div><div class="divider"></div><h3 style="color:var(--navy)">💳 Mode de paiement (simulation)</h3><label class="check-row"><input type="radio" checked name="payment"/> Carte bancaire — interface de démonstration</label><label class="check-row"><input type="radio" name="payment"/> Paiement à la livraison — concept</label><p class="notice">Ce prototype n'encaisse aucun paiement et ne transmet aucune donnée.</p><button class="btn primary wide" type="submit" style="margin-top:16px">Confirmer la commande fictive →</button></form><div class="summary"><h3 style="color:var(--navy);margin-top:0">Votre commande</h3>${Object.entries(S.cart).filter(([k,v])=>v>0).map(([k,v])=>{let p=products.find(p=>p.id==k);return `<div class="summary-line"><span>${esc(p?.name||'Article')} × ${v}</span><strong>${euro((p?.price||0)*v)}</strong></div>`}).join('')}<div class="summary-line"><span>Livraison estimée</span><strong>4,90 €</strong></div><div class="summary-line total"><span>Total de démonstration</span><strong>${euro(total()+4.9)}</strong></div><button class="btn outline wide" data-go="cart">← Retour au panier</button></div></div></div>`}
function success(){return `<div class="wrap"><div class="prose-card" style="max-width:700px;text-align:center;margin:70px auto;padding:65px 30px"><div style="font-size:64px">🎉</div><h1 class="page-title">Commande de démonstration confirmée !</h1><p class="page-desc">Votre parcours d'achat fictif est terminé. Aucune commande réelle, aucun paiement, aucun e-mail n'ont été envoyés.</p><div class="notice" style="margin:22px auto;max-width:490px">Référence maquette : <strong>PME-DEMO-2026</strong></div><div class="hero-actions" style="justify-content:center"><button class="btn primary" data-go="shop">Retourner en boutique</button><button class="btn outline" data-go="orders">Voir mes commandes</button></div></div></div>`}
function auth(){return `<div class="wrap"><div class="auth-wrap"><div class="auth-brand"><div class="eyebrow">✦ Espace membre</div><h2>Votre passion a trouvé sa maison.</h2><p>Un compte pour vos achats, vos échanges, vos lectures et les autres passionnés.</p><div style="font-size:100px;margin-top:35px">🏚️</div></div><div class="auth-form"><h2>Bienvenue !</h2><p class="page-desc">Connectez-vous ou rejoignez la communauté.</p><div class="auth-tabs"><button class="${S.authTab==='login'?'on':''}" data-authtab="login">Connexion</button><button class="${S.authTab==='register'?'on':''}" data-authtab="register">Créer un compte</button></div><form id="authForm">${S.authTab==='register'?`<label class="form-label">Pseudo</label><input class="field" required placeholder="Votre pseudo"/>`:''}<label class="form-label">Adresse e-mail</label><input class="field" type="email" required placeholder="exemple@email.fr"/><label class="form-label">Mot de passe</label><input class="field" type="password" minlength="6" required placeholder="••••••••"/>${S.authTab==='register'?`<label class="check-row"><input type="checkbox" required/> J'accepte les conditions de la plateforme (prototype)</label>`:`<button type="button" class="text-link" data-toast="Réinitialisation de mot de passe : maquette uniquement" style="display:block;margin:13px 0">Mot de passe oublié ?</button>`}<button type="submit" class="btn navybtn wide" style="margin-top:12px">${S.authTab==='login'?'Se connecter →':'Créer mon compte →'}</button></form><p style="text-align:center;color:var(--muted);font-size:11px;margin-top:25px">Aucun vrai compte n'est créé. Ce formulaire simule uniquement l'expérience.</p></div></div></div>`}
function accSide(){let options=[['dashboard','▦','Vue d’ensemble'],['orders','📦','Mes commandes'],['mylistings','🔄','Mes annonces'],['favorites','♡','Mes favoris'],['chat','✉','Messages'],['notifications','♧','Notifications'],['settings','⚙','Paramètres'],['moderation','🛡','Modération (démo)']];return `<aside class="account-side"><div class="account-profile"><span class="avatar" style="width:42px;height:42px">AL</span><div><strong>Alex Laurent</strong><small>Membre passionné · Démo</small></div></div>${options.map(([p,i,t])=>`<button class="account-link ${S.page===p?'on':''}" data-go="${p}"><span>${i}</span>${t}</button>`).join('')}<button class="account-link" data-go="auth"><span>↪</span>Se déconnecter</button></aside>`}
function acc(content){return `<div class="wrap">${crumb('Mon compte')}<div class="page-top"><h1 class="page-title">Mon espace</h1><p class="page-desc">Tous vos achats, échanges et préférences au même endroit.</p></div><div class="account-shell">${accSide()}<section>${content}</section></div></div>`}
function dashboard(){return acc(`<div class="dashboard-welcome"><h2>Bonjour, Alex 👋</h2><p>Ravi de vous retrouver ! Voici l’essentiel de votre activité dans la Petite Maison.</p><button class="btn primary small" data-go="publish">+ Publier une annonce</button></div><div class="stat-grid">${[['03','Commandes'],['02','Annonces actives'],['05','Favoris'],['01','Message reçu']].map(([n,t])=>`<div class="stat"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><div class="panel" style="padding:24px"><div class="section-heading"><h3 style="color:var(--navy);margin:0">Mes activités récentes</h3><button class="text-link" data-go="orders">Voir tout →</button></div>${[['📦','Commande #PME-0182','En préparation'],['🔄','Échange : collection BD','En cours'],['💬','Nouveau message de Camille','À lire']].map(([i,t,s])=>`<div class="alert"><span>${i}</span><div><strong>${t}</strong><p>${s}</p></div><button class="text-link" data-go="${i==='📦'?'orders':i==='💬'?'chat':'mylistings'}">Consulter</button></div>`).join('')}</div><div class="grid2" style="margin-top:18px"><button class="prose-card" data-go="shop" style="text-align:left;cursor:pointer"><strong style="color:var(--navy)">🛍️ Retour à la boutique →</strong><p class="page-desc">Découvrez les nouveautés.</p></button><button class="prose-card" data-go="swap" style="text-align:left;cursor:pointer"><strong style="color:var(--navy)">♻️ Explorer les échanges →</strong><p class="page-desc">Les annonces de la communauté.</p></button></div>`)}
function orders(){return acc(`<div class="prose-card"><h2 class="section-title">Mes commandes</h2><p class="page-desc">Retrouvez le suivi de vos achats (données de démonstration).</p><div class="tablewrap"><table class="data-table"><thead><tr><th>Commande</th><th>Date</th><th>Montant</th><th>État</th></tr></thead><tbody>${[['#PME-0182','18/11/2026','39,90 €','En préparation','orange'],['#PME-0174','03/11/2026','24,00 €','Livrée',''],['#PME-0151','12/10/2026','16,90 €','Livrée','']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="status ${x[4]}">${x[3]}</span></td></tr>`).join('')}${S.orderDone?`<tr><td><strong>#PME-DEMO-2026</strong></td><td>Aujourd'hui</td><td>${euro(total()+4.9)}</td><td><span class="status blue">Démonstration</span></td></tr>`:''}</tbody></table></div></div>`)}
function mylistings(){let mine=[{name:'BD fantastique — coffret',type:'Échange',status:'Publiée'},{name:'2 fanzines anciens',type:'Don',status:'En modération'},...S.userListings.map(x=>({name:x.name,type:x.type,status:'En modération'}))];return acc(`<div class="prose-card"><div class="section-heading"><div><h2 class="section-title">Mes annonces</h2><p class="section-sub">Suivez leur validation et les demandes de contact.</p></div><button class="btn secondary small" data-go="publish">+ Nouvelle annonce</button></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Annonce</th><th>Type</th><th>Statut</th><th>Action</th></tr></thead><tbody>${mine.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${x.type}</td><td><span class="status ${x.status==='En modération'?'orange':''}">${x.status}</span></td><td><button class="text-link" data-toast="Gestion des annonces : aperçu de maquette">Gérer</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function favorites(){let f=products.filter(p=>S.fav.has(p.id));return acc(`<div class="prose-card"><h2 class="section-title">Mes favoris</h2><p class="page-desc">Retrouvez vos trouvailles préférées.</p><div class="grid3" style="margin-top:20px">${f.length?f.map(productCard).join(''):`<div style="grid-column:1/-1" class="empty"><span>♡</span>Aucun favori pour l’instant.<br><button class="btn secondary small" data-go="shop" style="margin-top:15px">Découvrir la boutique</button></div>`}</div></div>`)}
function chat(){return acc(`<div class="prose-card" style="padding:16px"><h2 class="section-title" style="margin:0 0 17px">Messagerie</h2><div class="chat-layout"><div class="chat-contacts">${[['CR','Camille R.','Échange BD'],['AM','Alex M.','Don de jeu'],['ML','Morgan L.','Figurine']].map((x,i)=>`<button class="chat-item ${i===0?'on':''}" data-toast="Autre conversation : aperçu de maquette"><span class="avatar">${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></button>`).join('')}</div><div class="chat-main"><div style="padding:14px 18px;border-bottom:1px solid var(--border);font-weight:800;color:var(--navy);font-size:13px">Camille R. · Collection de BD</div><div class="chat-history">${S.chat.map((m,i)=>`<div class="bubble ${i%2?'me':''}">${esc(m)}</div>`).join('')}</div><form class="chat-bottom" id="chatForm"><input class="field" name="msg" placeholder="Écrire un message…" value="${esc(S.chatDraft)}"/><button class="btn secondary small" type="submit">Envoyer</button></form></div></div><p class="muted mini">Simulation locale. Aucun message réel n’est envoyé.</p></div>`)}
function notifications(){return acc(`<div class="prose-card"><h2 class="section-title">Mes notifications</h2><p class="page-desc">Les nouveautés qui pourraient vous intéresser.</p><div style="margin-top:18px">${[['🎁','Nouveau don près de chez vous','Un jeu de société est disponible à Paris.','swap'],['💬','Camille vous a répondu','Votre proposition d’échange a reçu une réponse.','chat'],['📦','Commande en préparation','Votre colis sera bientôt préparé.','orders'],['📰','Nouveau fanzine disponible','Découvrez le numéro 18.','fanzine']].map(([i,h,t,p])=>`<button class="alert" style="width:100%;text-align:left" data-go="${p}"><span>${i}</span><div><strong>${h}</strong><p>${t}</p></div><span style="margin-left:auto;font-size:18px;color:var(--teal)">›</span></button>`).join('')}</div></div>`)}
function settings(){return acc(`<div class="prose-card"><h2 class="section-title">Profil & préférences</h2><p class="page-desc">Gérez les informations de votre espace membre (simulation).</p><form id="profileForm"><div class="form-grid"><div><label class="form-label">Prénom</label><input class="field" value="Alex"/></div><div><label class="form-label">Nom</label><input class="field" value="Laurent"/></div></div><label class="form-label">Adresse e-mail</label><input class="field" type="email" value="alex@example.fr"/><label class="form-label">Ville</label><input class="field" value="Paris"/><h3 style="color:var(--navy);margin-top:28px">Notifications</h3>${[['news','Recevoir les actualités et nouveautés'],['swap','Recevoir les alertes de dons et échanges']].map(([k,t])=>`<button type="button" class="check-row" data-toggle="${k}" style="background:none"><span class="toggle ${S.settings[k]?'on':''}"></span>${t}</button>`).join('')}<button class="btn navybtn" style="margin-top:25px" type="submit">Enregistrer (simulation)</button></form></div>`)}
function fanzine(){return `<div class="wrap">${crumb('Fanzines')}<div class="page-top"><h1 class="page-title">Le Fanzine de l’Épouvante</h1><p class="page-desc">Quatre numéros par an pour explorer les frontières du cinéma, de l’horreur et de l’imaginaire.</p></div><div class="hero" style="min-height:275px;grid-template-columns:1fr 280px;background:linear-gradient(120deg,#113b58,#277b8b)"><div class="hero-copy" style="padding:37px"><span class="eyebrow">✦ LE NOUVEAU NUMÉRO EST ARRIVÉ</span><h1 style="font-size:35px;margin:15px 0">Le fantastique entre vos mains.</h1><p>À lire en ligne ou à recevoir au format papier. Choisissez votre formule.</p><button class="btn primary" data-go="reader">Feuilleter un extrait →</button></div><div class="fanzine-cover" style="height:230px;width:180px;margin:20px auto;transform:rotate(7deg);box-shadow:0 20px 30px #0018"><strong>ÉPOUVANTE<br><span style="font-size:50px">#18</span><br><span style="font-size:10px">LE NUMÉRO DU MYSTÈRE</span></strong></div></div><section class="section">${sectionHeading('Choisissez votre formule','Un univers à lire, à collectionner et à partager.')}<div class="grid3">${[['Numéro numérique','8,50 €','Lecture sur votre espace membre','📱'],['Abonnement numérique','29,00 € / an','4 numéros + archives numériques','💻'],['Abonnement papier + numérique','49,00 € / an','4 numéros livrés + accès en ligne','📦']].map(([h,p,t,i],idx)=>`<div class="prose-card" style="padding:24px"><div style="font-size:34px">${i}</div><h3 style="color:var(--navy)">${h}</h3><p class="page-desc">${t}</p><h2 style="color:var(--navy)">${p}</h2><button class="btn ${idx===2?'primary':'outline'} wide" data-go="${idx===0?'product':'checkout'}">Choisir cette formule →</button></div>`).join('')}</div></section><section class="section">${sectionHeading('Les derniers numéros','Disponibles en version numérique et papier.')}<div class="grid4">${[18,17,16,15].map((n,i)=>`<div class="prose-card" style="text-align:center;cursor:pointer" data-go="reader"><div class="fanzine-cover" style="background:linear-gradient(130deg,${['#1a334c','#572f4e','#124b58','#62482a'][i]},${['#126d79','#965c77','#28988b','#b18d55'][i]})"><strong>ÉPOUVANTE<br>#${n}</strong></div><h3 style="color:var(--navy)">Numéro ${n}</h3><p class="muted mini">Découvrir la revue →</p></div>`).join('')}</div></section></div>`}
function reader(){return `<div class="wrap">${crumb('Fanzines','Lecteur numérique')}<div class="page-top"><h1 class="page-title">Lecteur numérique — Épouvante #18</h1><p class="page-desc">Extrait fictif pour prévisualiser la liseuse intégrée au compte utilisateur.</p></div><div class="prose-card" style="background:#eaf0f4"><div class="section-heading"><strong style="color:var(--navy)">ÉPOUVANTE · NUMÉRO 18</strong><button class="btn outline small" data-go="fanzine">Fermer le lecteur ✕</button></div><div class="reading-page"><div class="product-category">LE NUMÉRO DU MYSTÈRE</div><h2>Quand le fantastique frappe à votre porte</h2><div style="font-size:100px;text-align:center;margin:33px auto">🏚️</div><p>Il était une fois, au bout d’une ruelle oubliée, une petite maison dont les fenêtres brillaient chaque soir d’une étrange lueur.</p><p>Ce numéro vous invite à explorer ces histoires qui traversent les époques : les maisons habitées, les héros de papier et les créatures de notre imaginaire.</p><p><em>Extrait fictif du prototype de lecture.</em></p></div><div class="hero-actions" style="justify-content:center;margin-top:20px"><button class="btn outline small" data-toast="Page précédente : maquette">← Page précédente</button><span style="padding:10px;color:var(--muted);font-size:12px">Page 1 / 8</span><button class="btn navybtn small" data-toast="Page suivante : maquette">Page suivante →</button></div></div></div>`}
function news(){return `<div class="wrap">${crumb('Festival & actualités')}<div class="page-top"><h1 class="page-title">Le festival et les nouvelles de la maison</h1><p class="page-desc">Projections, masterclasses, jeux de plateau et rencontres entre fans.</p></div><div class="hero" style="min-height:260px;grid-template-columns:1fr 230px;background:linear-gradient(130deg,#24314c,#65425d)"><div class="hero-copy" style="padding:40px"><div class="eyebrow">LE PETIT FESTIVAL DE L’ÉPOUVANTE</div><h1 style="font-size:35px;margin:12px 0">Le frisson se partage aussi en vrai.</h1><p>Retrouvez l’univers du festival : films, créations et communauté.</p><button class="btn primary" data-toast="Programme à venir — maquette de présentation">Découvrir le programme</button></div><div style="display:grid;place-items:center;font-size:115px">🎥</div></div><section class="section">${sectionHeading('À la une','Derniers contenus éditoriaux (exemples).')}<div class="grid3">${[['🎬','L’affiche du prochain festival','Plongez dans un programme de projections et rencontres.'],['📚','Dans les coulisses d’Evil Ed','Découvrez la production de L’Orc et les projets de création.'],['🎲','Les soirées jeux reprennent','Un rendez-vous pour les amateurs de mondes fantastiques.']].map(([i,h,t])=>`<article class="panel"><div class="article-icon" style="height:140px;font-size:70px">${i}</div><div style="padding:19px"><div class="product-category">ACTUALITÉS</div><h3 style="color:var(--navy)">${h}</h3><p class="page-desc">${t}</p><button class="text-link" data-toast="Page article : aperçu de maquette">Lire l'article →</button></div></article>`).join('')}</div></section></div>`}
function moderation(){return acc(`<div class="modpanel"><div class="section-heading"><div><h2 class="section-title">Modération des annonces</h2><p class="section-sub">Vue rôle MODERATOR — validation avant publication.</p></div><span class="pill">Démo métier</span></div><div class="stat-grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><strong>03</strong><span>En attente</span></div><div class="stat"><strong>12</strong><span>Approuvées</span></div><div class="stat"><strong>01</strong><span>Refusées</span></div></div><div class="panel" style="padding:21px"><h3 style="color:var(--navy)">Annonce à examiner</h3><div class="article-row"><div class="article-icon">📖</div><div><h3>Collection de livres anciens</h3><p>Don · Bordeaux · Membre : Nora P.</p><p>Un lot de 5 livres fantastiques en bon état.</p></div></div><p style="margin-top:19px;font-size:12px;color:var(--muted)">Décision actuelle : <strong>${S.modStatus==='pending'?'En attente':S.modStatus==='approved'?'Approuvée':'Refusée'}</strong></p><div class="admin-actions"><button class="btn secondary small" data-mod="approved">✓ Approuver</button><button class="btn outline small" data-mod="rejected">✕ Refuser</button><button class="btn ghost small" data-mod="pending">↺ Réinitialiser</button></div></div></div>`)}
function faq(){return `<div class="wrap">${crumb('Aide & FAQ')}<div class="page-top"><h1 class="page-title">Comment peut-on vous aider ?</h1><p class="page-desc">Les principales questions, de la boutique aux échanges.</p></div><div style="max-width:810px">${[['Comment acheter un article ?','Parcourez la boutique, choisissez un article, ajoutez-le au panier, puis finalisez votre commande. Le paiement est simulé dans ce prototype.'],['Comment donner ou échanger un objet ?','Accédez à l’espace Échanges & dons, sélectionnez Publier une annonce, décrivez l’article et soumettez-le à la modération.'],['Qui valide les annonces de troc ?','Une équipe de modération contrôle les annonces avant leur publication.'],['Comment recevoir des notifications ?','Dans votre compte, activez les alertes d’articles, de messages et de nouveautés.'],['Puis-je lire le fanzine en ligne ?','Oui. Les membres pourront accéder aux numéros numériques depuis un lecteur intégré à leur espace.'],['La plateforme est-elle déjà en service ?','Non. Cette version est une maquette UX/UI. Elle ne traite ni paiements, ni identités, ni messages réels.']].map(([h,p])=>`<details class="faq-item"><summary>${h}</summary><p>${p}</p></details>`).join('')}<button class="btn navybtn" data-go="contact" style="margin-top:20px">Contacter l’équipe →</button></div></div>`}

function contact(){return `<div class="wrap">${crumb('Contact')}<div class="page-top"><h1 class="page-title">Nous contacter</h1><p class="page-desc">Une question sur la boutique ou la communauté ?</p></div><div class="checkout-grid"><form class="prose-card" id="contactForm"><h3 style="color:var(--navy);margin-top:0">Envoyer un message</h3><label class="form-label">Votre nom</label><input class="field" required placeholder="Votre nom"/><label class="form-label">Votre e-mail</label><input class="field" required type="email" placeholder="vous@example.fr"/><label class="form-label">Sujet</label><select class="field"><option>Une question sur la boutique</option><option>Signaler une annonce</option><option>Une question sur mon compte</option><option>Autre demande</option></select><label class="form-label">Votre message</label><textarea class="field" required rows="5" placeholder="Écrivez votre message…"></textarea><button class="btn secondary" style="margin-top:20px" type="submit">Envoyer (simulation)</button></form><div class="summary"><h3 style="color:var(--navy)">Service client</h3><p class="page-desc">Nous imaginons un support simple, accessible et rassurant pour accompagner les acheteurs et les membres de la communauté.</p><div class="divider"></div><p class="notice">Toutes les données de cette page sont fictives. Le formulaire ne transmet aucun message.</p><button class="btn outline wide" data-go="faq" style="margin-top:14px">Voir la FAQ →</button></div></div></div>`}
function drawer(){return `<div class="screen-drawer ${S.drawer?'open':''}" id="drawer"><div class="drawer-body"><div class="drawer-head"><div><h2>Explorer les 24 écrans</h2><p class="page-desc" style="margin:4px 0 0">Clique sur une page pour voir la maquette.</p></div><button class="iconbtn" data-drawer="close">✕</button></div>${sections.map(s=>`<div class="drawer-section"><h3>${s.title}</h3><div class="drawer-grid">${s.screens.map(([p,t])=>`<button class="screen-button ${S.page===p?'on':''}" data-go="${p}">${t}</button>`).join('')}</div></div>`).join('')}<div class="notice">Prototype sans backend. Tu peux naviguer, ajouter au panier, simuler une commande, créer une annonce et tester les interactions de démonstration.</div></div></div>`}
function mobilebar(){return `<div class="mobilebar">${[['home','⌂','Accueil'],['shop','🛍','Boutique'],['swap','♻','Échanges'],['cart','🛒','Panier'],['dashboard','◉','Compte']].map(([p,i,t])=>`<button data-go="${p}" class="${S.page===p?'on':''}"><span>${i}</span>${t}</button>`).join('')}</div>`}
function view(){const map={home,shop,product,swap,listing,publish,cart,checkout,success,auth,dashboard,orders,mylistings,favorites,chat,notifications,settings,fanzine,reader,news,moderation,faq,about,contact};return (map[S.page]||home)();}
function render(){document.getElementById('app').innerHTML=nav()+`<main>${view()}</main>`+foot()+mobilebar()+`<div class="floating-switcher"><button class="floater" data-drawer="open">▦ &nbsp; Explorer les 24 pages</button></div>`+drawer();document.title=`${sections.flatMap(s=>s.screens).find(x=>x[0]===S.page)?.[1].replace(/^.\s/,'')||'Accueil'} | La Petite Maison de l’Épouvante`}
function go(page){S.page=page;S.drawer=false;S.quantity=1;render();window.scrollTo({top:0,behavior:'instant'});}
let timeout;function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>el.classList.remove('show'),2700)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-product],[data-listing],[data-add],[data-add-qty],[data-fav],[data-qty],[data-cartqty],[data-remove],[data-cat],[data-swapfilter],[data-shopcat],[data-clearshop],[data-authtab],[data-toast],[data-toggle],[data-mod],[data-drawer]');if(!t)return;if(t.hasAttribute('data-go'))return go(t.dataset.go);if(t.hasAttribute('data-product')){S.prod=+t.dataset.product;return go('product')}if(t.hasAttribute('data-listing')){S.listing=+t.dataset.listing;return go('listing')}if(t.hasAttribute('data-add')||t.hasAttribute('data-add-qty')){let id=+(t.dataset.add||t.dataset.addQty),qty=t.dataset.addQty?S.quantity:1;S.cart[id]=(S.cart[id]||0)+qty;render();return toast(`${qty} article(s) ajouté(s) au panier ✓`)}if(t.hasAttribute('data-fav')){let id=+t.dataset.fav;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);render();return toast(S.fav.has(id)?'Ajouté aux favoris ♥':'Retiré des favoris')}if(t.hasAttribute('data-qty')){S.quantity=Math.max(1,Math.min(20,S.quantity+(+t.dataset.qty)));return render()}if(t.hasAttribute('data-cartqty')){let [id,delta]=t.dataset.cartqty.split(':').map(Number);S.cart[id]=Math.max(0,(S.cart[id]||0)+delta);return render()}if(t.hasAttribute('data-remove')){delete S.cart[+t.dataset.remove];return render()}if(t.hasAttribute('data-cat')){S.shopCat=t.dataset.cat;return go('shop')}if(t.hasAttribute('data-swapfilter')){S.swapFilter=t.dataset.swapfilter;return render()}if(t.hasAttribute('data-shopcat')){S.shopCat=t.dataset.shopcat;return render()}if(t.hasAttribute('data-clearshop')){S.shopCat='Tout';S.shopSearch='';return render()}if(t.hasAttribute('data-authtab')){S.authTab=t.dataset.authtab;return render()}if(t.hasAttribute('data-toast'))return toast(t.dataset.toast);if(t.hasAttribute('data-toggle')){S.settings[t.dataset.toggle]=!S.settings[t.dataset.toggle];return render()}if(t.hasAttribute('data-mod')){S.modStatus=t.dataset.mod;render();return toast('Décision de modération mise à jour (simulation)')}if(t.hasAttribute('data-drawer')){S.drawer=t.dataset.drawer==='open';return render()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.shopSort=e.target.value;render()}if(e.target.matches('[data-shopcat]')){S.shopCat=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='shopsearch'){e.preventDefault();S.shopSearch=e.target.value;render()}if(e.key==='Escape'&&S.drawer){S.drawer=false;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='publishForm'){const f=new FormData(e.target),title=(f.get('title')||'').toString().trim(),city=(f.get('city')||'').toString().trim(),desc=(f.get('description')||'').toString().trim();if(!title||!city||!desc){return toast('Veuillez remplir les champs obligatoires')}S.userListings.push({name:title,type:f.get('type')});toast('Annonce envoyée en modération (simulation)');return go('mylistings')}if(id==='checkoutForm'){S.orderDone=true;return go('success')}if(id==='authForm'){S.signedIn=true;toast('Connexion de démonstration réussie');return go('dashboard')}if(id==='profileForm'){return toast('Préférences enregistrées dans la maquette')}if(id==='contactForm'){e.target.reset();return toast('Message simulé : aucun envoi réel')}if(id==='chatForm'){let v=new FormData(e.target).get('msg');if(v&&String(v).trim()){S.chat.push(String(v).trim());render();toast('Message ajouté à la conversation de démonstration')}}});render();
})();
</script></body></html>
