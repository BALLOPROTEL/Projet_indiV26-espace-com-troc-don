apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-migrate
  namespace: projet-indiv26
  labels:
    app.kubernetes.io/name: legacy-migrate
    app.kubernetes.io/part-of: projet-indiv26
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: projet-indiv26-legacy-migrate:m7-local
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: legacy-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
