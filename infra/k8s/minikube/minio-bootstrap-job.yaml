apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: projet-indiv26
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: projet-indiv26
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/part-of: projet-indiv26
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: projet-indiv26-minio-bootstrap:lot9b-local
          imagePullPolicy: Never
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-credentials
                  key: S3_SECRET_KEY
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing local/listing-images
              mc anonymous set none local/listing-images
              if ! mc admin policy info local listing-images-rw >/dev/null 2>&1; then
                mc admin policy create local listing-images-rw /config/listing-images-policy.json
              fi
              if ! mc admin user info local "$S3_ACCESS_KEY" >/dev/null 2>&1; then
                mc admin user add local "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              fi
              mc admin policy attach local listing-images-rw --user "$S3_ACCESS_KEY" || true
              echo "MinIO listing-images bootstrap: PASS"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policy
              mountPath: /config/listing-images-policy.json
              subPath: listing-images-policy.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: minio-bootstrap-policy
        - name: tmp
          emptyDir: {}
