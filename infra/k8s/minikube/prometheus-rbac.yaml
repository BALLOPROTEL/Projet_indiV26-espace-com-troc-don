apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: projet-indiv26
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: projet-indiv26
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: projet-indiv26
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: projet-indiv26
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: projet-indiv26
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
