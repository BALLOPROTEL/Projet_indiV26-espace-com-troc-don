apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-service
  namespace: projet-indiv26
  labels:
    app.kubernetes.io/name: commerce-service
    app.kubernetes.io/part-of: projet-indiv26
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce-service
        app.kubernetes.io/part-of: projet-indiv26
    spec:
      automountServiceAccountToken: false
      containers:
        - name: commerce-service
          image: projet-indiv26-commerce-service:l5a-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3104
          envFrom:
            - configMapRef:
                name: commerce-config
            - secretRef:
                name: commerce-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
