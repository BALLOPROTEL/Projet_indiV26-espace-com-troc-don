apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-bootstrap-policy
  namespace: projet-indiv26
data:
  listing-images-policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetBucketLocation",
            "s3:ListBucket"
          ],
          "Resource": [
            "arn:aws:s3:::listing-images"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject"
          ],
          "Resource": [
            "arn:aws:s3:::listing-images/*"
          ]
        }
      ]
    }
